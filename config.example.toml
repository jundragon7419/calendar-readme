# 설정 파일. config.toml 로 복사해서 쓰세요.
# .ics 주소 자체는 여기 넣지 말고 환경변수/GitHub Secrets 로 주입합니다.

[general]
timezone = "Asia/Seoul"
locale = "ko"            # "ko" | "en"
week_start = "mon"       # "mon" | "sun"
max_chips_per_day = 2    # 한 칸에 표시할 일정 개수 상한
busy_label = "바쁨"      # 제목을 감출 때 대신 쓸 문구

# 캘린더(피드) 목록. url_env 에 적은 이름의 환경변수에서 .ics 주소를 읽습니다.
# visibility:
#   "title" = 제목 그대로 노출
#   "busy"  = 제목 감추고 busy_label 로만 표시
#   "tag"   = public_tag 가 붙은 일정만 제목 노출, 나머지는 busy
[[calendars]]
name = "personal"
url_env = "ICS_URL_PERSONAL"
visibility = "tag"
color = "accent"

# [[calendars]]
# name = "study"
# url_env = "ICS_URL_STUDY"
# visibility = "title"
# color = "green"

[filter]
# visibility = "tag" 인 피드에서 제목을 공개할 표식.
# 일정 제목이 이 문자열로 시작하면 표식을 떼고 제목을 노출합니다.
public_tag = "[public]"

# 제목에 아래 문자열이 들어가면 달력에서 아예 제외합니다.
exclude_keywords = []

# 종일(all-day) 일정 포함 여부
include_all_day = true
