name: Update calendar

on:
  schedule:
    # 매시 정각 (UTC). 필요하면 주기를 늘리세요.
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config.toml"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write

concurrency:
  group: update-calendar
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate SVG
        env:
          # Settings > Secrets and variables > Actions 에 등록한 비공개 .ics 주소
          ICS_URL_PERSONAL: ${{ secrets.ICS_URL_PERSONAL }}
        run: python scripts/generate.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/calendar-*.svg
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore: update calendar [skip ci]"
          git push
